# 영화소식 자동수집 트리거.
# 필요한 저장소 시크릿:
#   APP_URL     — Railway 배포 URL (예: https://mk-studio.up.railway.app)
#   CRON_SECRET — Railway 환경변수 CRON_SECRET와 동일한 값
name: movie-news-cron

on:
  schedule:
    - cron: "0 23 * * *" # 매일 08:00 KST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger collect pipeline
        run: |
          # APP_URL 끝 슬래시 제거 — //api/... 는 308 리다이렉트로 파이프라인이 실행되지 않음
          BASE="${{ secrets.APP_URL }}"
          BASE="${BASE%/}"
          curl -sfL -X POST "$BASE/api/cron/collect" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 290
