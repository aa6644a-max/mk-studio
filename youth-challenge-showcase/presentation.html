<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다음 장면은 지금부터 — 청년도전지원사업 사례발표</title>
<style>
:root{
  --ink:#10151B;--paper:#F4F0E8;--lime:#D8FB65;--coral:#FC684F;--blue:#4568F7;--teal:#DDECE5;--dark:#151B23;
  --heading-font:"Pretendard","NanumSquare","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ease-emphasis:cubic-bezier(.22,1,.36,1);--ease-cut:cubic-bezier(.76,0,.24,1);
  --scene-enter:.7s;--scene-transition:.6s;--safe-x:125px;--safe-y:90px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070a;font-family:var(--heading-font);color:#fff;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--ink);word-break:keep-all}

/* ---- scene base ---- */
.scene{position:absolute;inset:0;padding:var(--safe-y) var(--safe-x);display:none;overflow:hidden}
.scene.active,.scene.out{display:block}
.scene.active{animation:arrive var(--scene-enter) var(--ease-emphasis) both}
.scene.out{animation:depart var(--scene-transition) var(--ease-cut) both;z-index:0}
@keyframes arrive{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
@keyframes depart{to{opacity:0;transform:translateY(-16px)}}

.eyebrow{font-size:24px;font-weight:800;letter-spacing:.12em}
.headline{font-size:136px;font-weight:900;line-height:1.1;letter-spacing:-.06em;margin:0;position:relative;z-index:2}
.headline .ln{display:block;overflow:hidden;padding-bottom:.08em}
.headline .ln>span{display:inline-block}
.sub{font-size:34px;line-height:1.5;font-weight:600;position:absolute;left:var(--safe-x);bottom:var(--safe-y)}
.foot{position:absolute;right:var(--safe-x);top:var(--safe-y);z-index:3;font-size:22px;font-weight:800;letter-spacing:.1em;opacity:.55}

/* reveal: end state is stable; no loops */
.scene .eyebrow,.scene .sub,.scene .tag,.scene .card,.scene .foot,.scene .photo-wrap,.scene .thanks{opacity:0}
.scene .headline .ln>span{transform:translateY(105%)}
.scene.active .eyebrow{animation:rise .7s .15s var(--ease-emphasis) both}
.scene.active .headline .ln>span{animation:mask .85s calc(.3s + var(--i)*.14s) var(--ease-emphasis) both}
.scene.active .sub{animation:rise .8s calc(.3s + var(--n)*.14s + .3s) var(--ease-emphasis) both}
.scene.active .foot,.scene.active .tag,.scene.active .thanks{animation:rise .8s 1s var(--ease-emphasis) both}
.scene.active .photo-wrap{animation:rise 1.1s .9s var(--ease-emphasis) both}
@keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@keyframes mask{from{transform:translateY(105%)}to{transform:none}}

/* themes */
.t-ink{background:var(--ink)}.t-ink .accent{color:var(--lime)}.t-ink .sub{color:#cfd8d6}.t-ink .eyebrow{color:var(--lime)}
.t-paper,.t-paper2{background:var(--paper);color:var(--ink)}.t-paper .accent{color:var(--coral)}.t-paper2 .accent{color:var(--blue)}
.t-paper .eyebrow{color:var(--coral)}.t-paper2 .eyebrow{color:var(--blue)}.t-paper .sub,.t-paper2 .sub{color:#464647}
.t-coral{background:var(--coral);color:var(--ink)}
.t-blue{background:var(--blue)}.t-blue .accent{color:var(--lime)}.t-blue .eyebrow{color:var(--lime)}
.t-mint{background:var(--teal);color:var(--ink)}
.t-dark{background:var(--dark)}.t-dark .accent{color:var(--lime)}.t-dark .eyebrow{color:var(--lime)}
.t-lime{background:var(--lime);color:var(--ink)}.t-lime .accent{color:var(--blue)}

/* hook */
.hook-ring{position:absolute;width:1080px;height:1080px;border:23px solid var(--lime);border-radius:50%;right:-420px;top:-170px;opacity:0;transform:rotate(20deg)}
.hook-ring.b{width:670px;height:670px;border:2px solid rgba(255,255,255,.25);right:40px;top:300px}
.scene.active .hook-ring{animation:ring 1.4s .1s var(--ease-emphasis) both}
@keyframes ring{from{opacity:0;transform:rotate(-40deg) scale(.9)}to{opacity:.95;transform:rotate(20deg)}}
.t-ink .headline{margin-top:150px}.t-ink .sub{color:#cfd8d6}
/* before */
.ghost{position:absolute;right:30px;top:20px;font-size:600px;font-weight:900;line-height:1;opacity:0;color:var(--ink)}
.scene.active .ghost{animation:ghost 1.2s .4s var(--ease-emphasis) both}
@keyframes ghost{to{opacity:.06}}
.t-paper .headline{margin-top:150px}
.t-paper .sub{border-left:6px solid var(--coral);padding-left:32px}
/* doubt */
.track{position:absolute;left:-60px;right:-60px;white-space:nowrap;font-size:120px;font-weight:900;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:2px rgba(16,21,27,.35);opacity:0}
.track.a{top:130px}.track.b{bottom:210px}
.scene.active .track{animation:track 1.1s .2s var(--ease-emphasis) both}
@keyframes track{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
.t-coral .headline{margin-top:270px}
.tag{position:absolute;right:var(--safe-x);top:430px;background:var(--ink);color:var(--paper);padding:20px 36px;font-size:30px;font-weight:900;transform:rotate(6deg)}
.t-coral .sub{font-weight:800}
/* turn */
.bignum{position:absolute;right:50px;top:30px;font-size:820px;font-weight:900;line-height:.9;color:rgba(255,255,255,.09);letter-spacing:-.06em;transform:scale(1.25);opacity:0}
.scene.active .bignum{animation:num 1.2s .1s var(--ease-emphasis) both}
@keyframes num{to{opacity:1;transform:scale(1)}}
.t-blue .headline{margin-top:200px}
.t-blue .sub{left:auto;right:var(--safe-x);border-top:2px solid rgba(255,255,255,.6);padding-top:24px}
/* experience */
.t-mint .headline{font-size:104px;margin-top:30px}
.cards{position:absolute;left:var(--safe-x);right:var(--safe-x);bottom:var(--safe-y);height:480px;display:flex;gap:28px}
.card{flex:1;border-radius:30px;padding:44px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;box-shadow:0 12px 40px rgba(15,40,30,.1)}
.card:nth-child(1){background:#153229;color:#eff8ed}.card:nth-child(2){background:#f2f0e6;color:#16242a}.card:nth-child(3){background:var(--lime);color:#16242a}
.card .lab{font-size:24px;font-weight:900;letter-spacing:.1em}.card .word{font-size:54px;line-height:1.15;font-weight:900;letter-spacing:-.06em}
.card .det{font-size:28px;opacity:.8;margin-top:14px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.scene.active .card{animation:rise .75s calc(.9s + var(--i)*.65s) var(--ease-emphasis) both}
/* journey */
.t-dark .headline{font-size:112px;margin-top:40px}
.map{position:absolute;left:var(--safe-x);right:var(--safe-x);top:610px;height:300px}
.map svg{position:absolute;left:0;top:70px;width:100%;height:160px;overflow:visible}
.map path{fill:none;stroke:var(--lime);stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.scene.active .map path{animation:draw 1.6s 1s var(--ease-emphasis) both}
@keyframes draw{to{stroke-dashoffset:0}}
.node{position:absolute;top:150px;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#3a444f;opacity:.4}
.scene.active .node{animation:node .6s calc(1s + var(--i)*.8s) var(--ease-emphasis) both}
@keyframes node{to{background:var(--lime);opacity:1;box-shadow:0 0 0 14px rgba(216,251,101,.18)}}
.node .l{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);white-space:nowrap;font-size:40px;font-weight:900}
.node .d{position:absolute;left:50%;top:50px;transform:translateX(-50%);white-space:nowrap;font-size:26px;color:#9eabb5}
.node .e{position:absolute;left:50%;top:92px;transform:translateX(-50%);font-size:20px;letter-spacing:.2em;color:var(--lime);opacity:.7}
/* today */
.t-paper2 .headline{margin-top:170px;font-size:128px}
.t-paper2 .sub{max-width:1000px}
.photo-wrap{position:absolute;right:150px;top:150px;width:520px;height:690px;padding:22px;background:#fff;box-shadow:20px 24px 0 #e2ded6;transform:rotate(5deg)}
.photo{width:100%;height:calc(100% - 60px);background:linear-gradient(125deg,#34474c,#b2c7b9);display:grid;place-items:center;color:#fff;font-size:28px;text-align:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo-wrap p{margin:14px 6px 0;font-size:22px;color:#555;letter-spacing:.1em}
/* next */
.t-lime .headline{margin-top:170px}
.circle{position:absolute;right:-250px;bottom:-640px;width:1400px;height:1400px;border-radius:50%;border:160px solid var(--ink);opacity:0;transform:scale(.6)}
.scene.active .circle{animation:grow 1.8s .2s var(--ease-emphasis) both}
@keyframes grow{to{opacity:1;transform:none}}
.t-lime .sub{font-weight:800}
.thanks{position:absolute;right:170px;bottom:110px;font-size:64px;font-weight:900;letter-spacing:-.04em;color:var(--lime);z-index:3}

/* chrome */
#progress{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12);z-index:10}
#progress i{display:block;height:100%;width:0;background:var(--coral);transition:width .5s ease}
#ui{position:fixed;left:16px;bottom:14px;z-index:10;display:flex;gap:16px;align-items:center;font-size:13px;color:#fff;background:rgba(17,25,35,.72);padding:8px 14px;border-radius:18px;opacity:.8}
#hint{opacity:.7}
body.hide-ui #ui,body.hide-ui #progress{display:none}
#notes{position:fixed;left:16px;top:16px;z-index:20;max-width:420px;padding:16px 20px;background:rgba(16,21,27,.94);border:1px solid rgba(255,255,255,.3);border-radius:14px;font-size:16px;line-height:1.6}
#notes[hidden]{display:none}
#notes b{display:block;color:var(--lime);margin-bottom:6px;font-size:13px;letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
}
/* static (PDF 내보내기용: 모든 모션 끝 상태 고정) */
body.static *,body.static *::before,body.static *::after{animation-duration:.001ms!important;animation-delay:0s!important;transition:none!important}
body.static #ui,body.static #progress,body.static #notes{display:none!important}

/* ghost on blue / chips / photo slots */
.t-blue .ghost{color:#fff;right:-20px;top:60px}
.t-blue .sub{max-width:760px}
.scene.active .t-blue .ghost,.t-blue.active .ghost{animation:ghost 1.2s .4s var(--ease-emphasis) both}
.chips{position:absolute;left:var(--safe-x);right:var(--safe-x);bottom:250px;display:flex;gap:24px;z-index:2}
.chip{font-size:56px;font-weight:900;letter-spacing:-.04em;padding:22px 44px;border-radius:999px;border:4px solid var(--ink);opacity:0}
.chip:last-child{background:var(--lime)}
.scene.active .chip{animation:rise .75s calc(1s + var(--i)*.35s) var(--ease-emphasis) both}
.t-paper .headline{margin-top:90px}
.cards.tall{height:640px}
.t-mint .cards.tall+*{}
.slot{flex:1;margin:22px 0;border-radius:18px;background:rgba(16,21,27,.12);display:grid;place-items:center;overflow:hidden;font-size:22px;letter-spacing:.2em;opacity:.7}
.slot img{width:100%;height:100%;object-fit:cover}
.cards.tall .word{font-size:46px}
.t-dark .cards{height:430px}
.t-dark .headline{font-size:112px}
.node .l{font-size:34px;bottom:84px}
.slot,.photo{position:relative}.slot>img,.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media (max-width:900px){#hint{display:none}#ui{padding:4px 10px;font-size:11px;left:8px;bottom:8px}}
@media (orientation:portrait) and (max-width:900px){#viewport::before{content:"📱 가로로 돌려서 보세요";position:absolute;top:18px;left:0;right:0;text-align:center;color:#fff;font-size:15px;opacity:.85;z-index:5}}

/* ===== LIGHT PALETTE (white tone) ===== */
html,body{background:#e9e7e1}
#progress{background:rgba(16,21,27,.08)}
.t-ink,.t-coral,.t-paper,.t-dark{background:#fff;color:var(--ink)}
.t-blue{background:#EAEFFE;color:var(--ink)}
.t-sage{background:#E9F0EA;color:var(--ink)}
.t-mint{background:#F3F7F4}
.t-paper2{background:var(--paper)}
.t-lime{background:#fff}
.t-ink .accent,.t-dark .accent,.t-blue .accent,.t-sage .accent,.t-lime .accent{color:var(--blue)}
.t-coral .accent,.t-paper .accent{color:var(--coral)}
.t-ink .eyebrow,.t-dark .eyebrow,.t-blue .eyebrow,.t-sage .eyebrow,.t-lime .eyebrow,.t-paper2 .eyebrow{color:var(--blue)}
.t-coral .eyebrow,.t-paper .eyebrow{color:var(--coral)}
.t-ink .sub,.t-dark .sub,.t-sage .sub,.t-lime .sub,.t-blue .sub{color:#464647}
.t-ink .headline,.t-sage .headline{margin-top:150px}
.hook-ring.b{border-color:rgba(16,21,27,.18)}
/* coral -> white: tracks stay coral */
.track{-webkit-text-stroke:2px rgba(252,104,79,.5)}
/* blue -> light blue tint */
.t-blue .ghost{color:var(--blue);right:-20px;top:60px}
.t-blue .sub{border-top-color:rgba(16,21,27,.35)}
.bignum{color:rgba(16,21,27,.06)}
/* sage (scene 6) */
.t-sage .sub{position:absolute}
/* timeline on light */
.map path{stroke:var(--blue)}
@keyframes node{to{background:var(--blue);opacity:1;box-shadow:0 0 0 14px rgba(69,104,247,.16)}}
.node{background:#c9ced6}
.node .e{color:var(--blue)}.node .d{color:#6b7480}
/* cards on white */
.card{box-shadow:0 12px 40px rgba(15,40,30,.1)}
.card:nth-child(2){border:1px solid rgba(16,21,27,.1)}
.t-dark .card:nth-child(2){background:#F4F0E8}
/* ending */
.circle{background:var(--lime);border-color:var(--ink)}
.thanks{color:var(--ink)}
#ui{background:rgba(16,21,27,.78)}
.t-lime .sub{max-width:800px}

/* film strip (scene: field) */
.film{position:absolute;left:0;width:1920px;top:520px;height:340px;overflow:hidden;z-index:1}
.film-strip{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:26px;padding:0 26px;background:#10151B;transform:translateX(1920px);width:max-content}
.film-strip::before,.film-strip::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#EAEFFE 0 22px,transparent 22px 44px);opacity:.9}
.film-strip::before{top:14px}.film-strip::after{bottom:14px}
.film-frame{position:relative;flex:none;width:400px;height:250px;background:linear-gradient(125deg,#34474c,#8da6a0);display:grid;place-items:center;color:rgba(255,255,255,.75);font-size:22px;letter-spacing:.2em;overflow:hidden}
.film-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t-blue .headline{margin-top:60px}
.t-blue .sub{max-width:1500px;left:var(--safe-x);right:auto;border-top:0;padding-top:0}

</style>
</head>

<script>
// content.js 의 데이터를 장면 DOM으로 변환. 개인 사실은 여기에 하드코딩하지 않는다.
(() => {
  const C = window.CONTENT;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const head = (lines, cls = '') =>
    `<h1 class="headline ${cls}">${lines.map((l, i) =>
      `<span class="ln"><span class="${l.accent ? 'accent' : ''}" style="--i:${i}">${esc(l.t)}</span></span>`).join('')}</h1>`;
  const photo = (src, alt) => src ? `<img src="${esc(src)}" alt="${esc(alt)}">` : '';
  // 경로를 비워 두면 assets/photos/<이름>.(jpg|jpeg|png|webp) 를 자동으로 찾는다. 없으면 자리표시자 유지.
  const auto = name => `<img data-auto="${esc(name)}" alt="">`;

  const body = {
    hook: () => `<div class="hook-ring"></div><div class="hook-ring b"></div>`,
    film: s => body.ghost(s) + `<div class="film"><div class="film-strip" data-seconds="${s.film.seconds || 30}">${Array.from({ length: s.film.count }, (_, i) =>
      `<div class="film-frame"><span>현장 ${String(i + 1).padStart(2, '0')}</span>${auto(s.film.prefix + '-' + (i + 1))}</div>`).join('')}</div></div>`,
    ghost: s => `<div class="ghost" style="font-size:${s.ghostSize || 600}px" aria-hidden="true">${esc(s.ghost)}</div>`,
    track: s => `<div class="track a" aria-hidden="true">${(esc(s.repeat) + ' ').repeat(6)}</div><div class="track b" aria-hidden="true">${(esc(s.repeat) + ' ').repeat(6)}</div><div class="tag">${esc(s.tag)}</div>`,
    bignum: s => `<div class="bignum" aria-hidden="true">${esc(s.bignum)}</div>`,
    chips: s => `<div class="chips">${s.chips.map((c, i) => `<span class="chip" style="--i:${i}">${esc(c)}</span>`).join('')}</div>`,
    cards: s => `<div class="cards${s.slots ? ' tall' : ''}">${s.cards.map((c, i) =>
      `<div class="card" style="--i:${i}"><div class="lab">${esc(c.label)}</div>${s.slots ? `<div class="slot"><span>PHOTO</span>${c.photo ? photo(c.photo, c.word) : auto(s.id + '-' + (i + 1))}</div>` : photo(c.photo, c.word)}<div><div class="word">${esc(c.word)}</div>${c.detail ? `<div class="det">${esc(c.detail)}</div>` : ''}</div></div>`).join('')}</div>`,
    timeline: s => { const n = s.nodes.length; return `<div class="map"><svg viewBox="0 0 1000 160" preserveAspectRatio="none"><path pathLength="1" d="M0 80 C 180 10, 320 150, 500 80 S 820 10, 1000 80"/></svg>${
      s.nodes.map((x, i) => `<div class="node" style="--i:${i};left:${i / (n - 1) * 100}%"><span class="l">${esc(x.label)}</span>${x.detail ? `<span class="d">${esc(x.detail)}</span>` : ''}</div>`).join('')}</div>`; },
    photo: s => `<div class="photo-wrap"><div class="photo"><span>실제 사진</span>${s.photo ? photo(s.photo, '') : auto(s.id)}</div><p>${esc(s.photoCaption)}</p></div>`,
    end: s => `<div class="circle"></div><div class="thanks">${esc(s.thanks)}</div>`
  };

  const stage = document.getElementById('stage');
  C.scenes.forEach((s, idx) => {
    const el = document.createElement('section');
    el.className = `scene t-${s.theme}`;
    el.dataset.id = s.id;
    el.style.setProperty('--n', s.headline.length);
    el.innerHTML = `${(body[s.kind] || (() => ''))(s)}<div class="eyebrow">${esc(s.eyebrow)}</div>${head(s.headline)}${s.sub ? `<div class="sub">${esc(s.sub)}</div>` : ''}<div class="foot">${String(idx + 1).padStart(2, '0')} / ${String(C.scenes.length).padStart(2, '0')}</div>`;
    stage.appendChild(el);
  });
  // 자동 사진: 확장자를 순서대로 시도. 하나라도 찾으면 못 찾은 필름 프레임은 제거한다.
  const exts = ['jpg', 'jpeg', 'png', 'webp'];
  const load = img => new Promise(res => {
    const base = 'assets/photos/' + img.dataset.auto + '.';
    let k = 0;
    img.onload = () => res(true);
    const emb = window.PHOTOS && window.PHOTOS[img.dataset.auto]; // build-single.py --photos 로 내장된 사진
    if (emb) { img.src = emb; return; }
    img.onerror = () => { if (++k < exts.length) img.src = base + exts[k]; else { img.remove(); res(false); } };
    img.src = base + exts[0];
  });
  window.photosReady = Promise.all([...document.querySelectorAll('img[data-auto]')].map(img => {
    const frame = img.closest('.film-frame');
    return load(img).then(ok => ({ frame, ok }));
  })).then(rs => {
    document.querySelectorAll('.film-strip').forEach(strip => {
      const mine = rs.filter(r => r.frame && strip.contains(r.frame));
      if (mine.some(r => r.ok)) mine.filter(r => !r.ok).forEach(r => r.frame.remove());
    });
  });
  document.title = C.meta.title;
})();

</script>
<script>
// 장면 전환·키보드·노트·스케일. 자동 재생 없음.
(() => {
  const C = window.CONTENT, scenes = [...document.querySelectorAll('.scene')], N = scenes.length;
  const stage = document.getElementById('stage'), bar = document.querySelector('#progress i');
  const count = document.getElementById('count'), notes = document.getElementById('notes');
  const params = new URLSearchParams(location.search);
  const ch = 'BroadcastChannel' in window ? new BroadcastChannel('youth-showcase') : null;
  let cur = -1, gen = 0, filmAnim = null;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches || params.has('static');

  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%,-50%) scale(${k})`;
  }
  addEventListener('resize', fit); fit();

  function renderNotes() {
    const s = C.scenes[cur];
    notes.innerHTML = `<b>${String(cur + 1).padStart(2, '0')} · ${s.name} · ${s.time}</b>${s.note}`;
  }

  function go(n, fromRemote) {
    n = Math.max(0, Math.min(N - 1, n));
    if (n === cur) return;
    const prev = scenes[cur], my = ++gen;
    scenes.forEach(el => { if (el !== prev) el.classList.remove('active', 'out'); });
    if (prev) { prev.classList.remove('active'); prev.classList.add('out'); setTimeout(() => { if (gen === my) prev.classList.remove('out'); }, 650); }
    cur = n;
    const el = scenes[cur];
    el.classList.remove('out'); void el.offsetWidth; el.classList.add('active'); // 애니메이션 재시작
    bar.style.width = ((cur + 1) / N * 100) + '%';
    count.textContent = `${String(cur + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')} · ${C.scenes[cur].name}`;
    if (!notes.hidden) renderNotes();
    history.replaceState(null, '', '#' + (cur + 1));
    if (filmAnim) { filmAnim.cancel(); filmAnim = null; }
    const strip = el.querySelector('.film-strip');
    if (strip) window.photosReady.then(() => { if (gen === my) runFilm(strip); });
    if (!fromRemote && ch) ch.postMessage({ go: cur });
  }

  // 필름 스트립: 오른쪽에서 들어와 한 번 지나가고 마지막 프레임에서 멈춘다(반복 없음).
  function runFilm(strip) {
    const W = strip.scrollWidth, end = W > 1920 ? 1920 - W : (1920 - W) / 2;
    const sec = still ? 0.001 : Number(strip.dataset.seconds) || 30;
    filmAnim = strip.animate([{ transform: 'translateX(1920px)' }, { transform: `translateX(${end}px)` }],
      { duration: sec * 1000, delay: still ? 0 : 1000, easing: 'linear', fill: 'both' });
  }

  function toggleNotes() { notes.hidden = !notes.hidden; if (!notes.hidden) renderNotes(); }
  function fullscreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }

  // 발표자 창: 보조 모니터에 노트·다음 장면 표시. 메인 화면에는 노트가 나오지 않는다.
  function openPresenter() {
    const w = window.open('', 'presenter', 'width=900,height=600');
    if (!w) return;
    const data = JSON.stringify(C.scenes.map(s => ({ n: s.name, t: s.time, note: s.note, h: s.headline.map(l => l.t).join(' ') })));
    w.document.open();
    w.document.write(`<!doctype html><meta charset=utf-8><title>발표자 노트</title><body style="font:20px/1.6 sans-serif;background:#10151b;color:#fff;padding:28px"><div id=a></div><hr style="opacity:.2"><div id=b style="opacity:.6"></div><script>
const D=${data};let i=0;const ch=new BroadcastChannel('youth-showcase');
function r(){const s=D[i],x=D[i+1];a.innerHTML='<div style="color:#d8fb65;font-weight:800">'+(i+1)+'/'+D.length+' · '+s.n+' · '+s.t+'</div><h1>'+s.h+'</h1><p style="font-size:26px">'+s.note+'</p>';b.textContent=x?'NEXT → '+x.h:'END'}
ch.onmessage=e=>{i=e.data.go;r()};r();
addEventListener('keydown',e=>{if(['ArrowRight',' '].includes(e.key))ch.postMessage({cmd:1});if(e.key=='ArrowLeft')ch.postMessage({cmd:-1})});<\/script>`);
    w.document.close();
  }
  if (ch) ch.onmessage = e => { if ('go' in e.data) go(e.data.go, true); else if (e.data.cmd) go(cur + e.data.cmd); };

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(cur - 1); }
    else if (k === 'Home') go(0); else if (k === 'End') go(N - 1);
    else if (k.toLowerCase() === 'f') fullscreen();
    else if (k.toLowerCase() === 'n') toggleNotes();
    else if (k.toLowerCase() === 'p') openPresenter();
    else if (k.toLowerCase() === 'h') document.body.classList.toggle('hide-ui');
  });

  // 터치: 오른쪽 탭/왼쪽 스와이프 = 다음, 왼쪽 탭/오른쪽 스와이프 = 이전
  let tx = 0, ty = 0;
  addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) go(cur + (tx > innerWidth / 2 ? 1 : -1));
  }, { passive: true });

  if (params.has('static')) document.body.classList.add('static');
  if (params.has('clean')) document.body.classList.add('hide-ui');
  const start = parseInt(params.get('scene') || location.hash.slice(1), 10);
  go(Number.isFinite(start) ? start - 1 : 0);
  window.showcaseGo = go;
})();

</script>
